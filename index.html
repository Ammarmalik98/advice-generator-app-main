<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Advice generator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<script defer src="script.js"></script>
</head>
<body>
  <div class="container">
    <h1 id="advice-id">Advice #1</h1><!-- Advice ID goes here -->

    <p id="advice-text">A little drop of water makes the mighty ocean.<!-- Advice text goes here -->"</p>
    <img src="./images/pattern-divider-desktop.svg" alt="divider" id="divider">
    <button id="generate-btn">
      <img src="./images/icon-dice.svg" alt="dice icon" style="width: 20px; height: 20px;">
    </button>

  </div>

  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Stanley Okeke</a>. 
    Coded by <a href="https://github.com/Ammarmalik98">Ammar Malik</a>.
  </div>
</body>
</html>
